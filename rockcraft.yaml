name: data-platform-k8s-mutator
base: ubuntu@24.04
version: "1.3"
summary: Mutating Webhook for sysctls
description: |
  Mutating webhook that injects sysctls into OpenSearch StatefulSets.
platforms:
  amd64:
extensions:
  - fastapi-framework

parts:
  fastapi-framework/install-app:
    source: .
    prime:
      - app/app.py
      - app/requirements.txt
