[project]
name = "data-platform-k8s-mutator"
version = "1.0.0"
description = "Kubernetes mutating admission webhook that injects a sysctl into workload pod specs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "fastapi[standard]",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
